<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnify AI - Smart Camera Magnifier</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
</head>
<body>
    <div class="app-container">
        <video id="camera" autoplay playsinline></video>
        <canvas id="canvas" style="display: none;"></canvas>
        
        <div class="controls-overlay">
            <div class="zoom-control">
                <input type="range" id="zoomSlider" class="zoom-slider" min="1" max="10" step="0.1" value="1">
                <span class="zoom-icon">🔍</span>
            </div>
            <button id="aiBtn" class="control-btn ai-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
                <span class="ai-label">AI</span>
            </button>
            <button id="flashBtn" class="control-btn flash-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M7 2v11h3v9l7-12h-4l4-8z"/>
                </svg>
            </button>
        </div>
        
        <div id="magnifier" class="magnifier hidden">
            <div class="magnifier-content">
                <img id="magnifiedImage" alt="Magnified view">
                <button id="closeMagnifier" class="close-btn">×</button>
            </div>
        </div>
        
        <div id="loadingOverlay" class="loading-overlay hidden">
            <div class="loading-spinner"></div>
            <p>Analyzing with AI...</p>
        </div>
        
        <div class="zoom-indicator">
            <span id="zoomLevel">1x</span>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.158.0/build/three.module.js"
        }
    }
    </script>
    <script type="module" src="app.js"></script>

</body>
</html>
